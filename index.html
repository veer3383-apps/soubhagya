// ── Helpers ──────────────────────────────────────────────────
const daysAgo = (s) => {
  if (!s) return 'N/A';

  const d = new Date(s);
  const t = new Date();

  d.setHours(0,0,0,0);
  t.setHours(0,0,0,0);

  const days = Math.floor((t - d) / 86400000);

  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';

  if (days < 30) return `${days}d ago`;

  const months = Math.floor(days / 30);
  const remDays = days % 30;

  if (remDays === 0) {
    return `${months} ${months === 1 ? 'month' : 'months'} ago`;
  }

  return `${months} ${months === 1 ? 'month' : 'months'}, ${remDays}d ago`;
};

const getAge = (dob) => {
  if (!dob) return null;
  const d = new Date(dob);
  if (isNaN(d)) return null;
  const t = new Date();
  let age = t.getFullYear() - d.getFullYear();
  const m = t.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < d.getDate())) age--;
  return age;
};

// ── Pipeline steps ───────────────────────────────────────────
const STEPS = [
  { key:'login',    icon:'login',    label:'Logging In'       },
  { key:'counting', icon:'scan',     label:'Counting Pages'   },
  { key:'scanning', icon:'search',   label:'Scanning Profiles'},
  { key:'scraping', icon:'download', label:'Fetching Details' },
  { key:'matching', icon:'cpu',      label:'Ashtakoot Match'  },
];

// ── Progress overlay ─────────────────────────────────────────
const ProgressOverlay = ({ st }) => {
  const si  = STEPS.findIndex(s => s.key === st.step);
  const pct = st.total > 0 ? Math.round(st.progress/st.total*100) : 0;
  const hasBar = ['scanning','scraping','matching'].includes(st.step);
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70"
      style={{backdropFilter:'blur(8px)'}}>
      <div className="bg-white rounded-3xl p-8 w-full max-w-lg mx-4 shadow-2xl">
        <div className="flex items-center gap-3 mb-8">
          <div className="w-10 h-10 rounded-xl bg-pink-100 flex items-center justify-center text-pink-600">
            <Ic n="loader" size={20} cls="spin"/>
          </div>
          <div>
            <h2 className="font-bold text-lg">Pipeline Running</h2>
            <p className="text-slate-400 text-sm">Please wait — this takes a few minutes</p>
          </div>
        </div>
        <div className="space-y-2 mb-8">
          {STEPS.map((s, i) => {
            const done=i<si, cur=i===si, pend=i>si;
            return (
              <div key={s.key} className={`flex items-center gap-3 p-3 rounded-xl
                ${cur?'bg-pink-50 border border-pink-200':''}
                ${done?'opacity-40':''}${pend?' opacity-20':''}`}>
                <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0
                  ${done?'bg-green-100 text-green-600':cur?'bg-pink-100 text-pink-600':'bg-slate-100 text-slate-400'}`}>
                  {done?<Ic n="check" size={15}/>:cur?<Ic n="loader" size={15} cls="spin"/>:<Ic n={s.icon} size={15}/>}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-semibold">{s.label}</div>
                  {cur && <div className="text-xs text-pink-600 truncate">{st.message}</div>}
                </div>
                {cur && hasBar && st.total>0 &&
                  <span className="text-xs font-bold text-pink-600 shrink-0">{st.progress}/{st.total}</span>}
              </div>
            );
          })}
        </div>
        {hasBar && st.total>0 && (
          <div>
            <div className="flex justify-between text-xs text-slate-400 mb-1.5">
              <span className="truncate mr-2">{st.message}</span>

};

// ── Main App ─────────────────────────────────────────────────
function App() {
  const [phase, setPhase]     = useState('init');
  const [info, setInfo]       = useState(null);
  const [filters, setFilters] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('filters')) || { agemin: null, agemax: null, months: null };
    } catch {
      return { agemin: null, agemax: null, months: null };
    }
  });
  const [profiles, setProfiles] = useState([]);
  const [st, setSt]           = useState({running:false,message:'',step:'',progress:0,total:0});
  const [selected, setSelected] = useState(null);
  const [search, setSearch]   = useState('');
  const [cast, setCast]       = useState('All');
  const [city, setCity]       = useState('All');
  const [sort, setSort]       = useState('rankAsc');
  const [error, setError]     = useState(null);
  const pollRef = useRef(null);

  useEffect(()=>{
    fetch('/api/has_results').then(r=>r.json())
      .then(d=>{setInfo(d);setPhase('startup');})
      .catch(()=>setPhase('startup'));
  },[]);

  useEffect(() => {
    localStorage.setItem('filters', JSON.stringify(filters));
  }, [filters]);

  const loadResults = useCallback(()=>
    fetch('/api/results').then(r=>r.json()).then(d=>setProfiles(Array.isArray(d)?d:[])), []);

  const pollStatus = useCallback(async()=>{
    const d = await fetch('/api/status').then(r=>r.json());
    setSt(d);
    if(!d.running && d.step==='done'){
      clearInterval(pollRef.current);
      await loadResults();
      setPhase('ready');
    }
    if(!d.running && d.step==='error'){
      clearInterval(pollRef.current);
      setError(d.message);
      setPhase('ready');
    }
  },[loadResults]);

  const handleExisting = useCallback(async()=>{
    await loadResults();
    const saved = localStorage.getItem('filters');
    if (saved) {
      try {
        setFilters(JSON.parse(saved));
      } catch {}
    }
    setPhase('ready');
  },[loadResults]);

  const handleFresh = useCallback(async(params)=>{
    setFilters(params);
    setPhase('running'); setError(null);
    await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)});
    clearInterval(pollRef.current);
    pollRef.current = setInterval(pollStatus,1500);
  },[pollStatus]);

  useEffect(()=>()=>clearInterval(pollRef.current),[]);

  const casts  = useMemo(()=>['All',...new Set(profiles.map(p=>p.Cast).filter(Boolean))].sort(),[profiles]);
  const cities = useMemo(()=>['All',...new Set(profiles.map(p=>p.City).filter(Boolean))].sort(),[profiles]);
  const topPct = useMemo(()=>profiles.length?Math.max(...profiles.map(p=>p.compatibility_percent||0)):0,[profiles]);
  const avg    = useMemo(()=>profiles.length?(profiles.reduce((s,p)=>s+(p.match_score||0),0)/profiles.length).toFixed(1):0,[profiles]);

  const filtered = useMemo(()=>{
    const q=search.toLowerCase();
    return profiles
      .filter(p=>(!q||(p.id||'').toLowerCase().includes(q)||(p.Profession||'').toLowerCase().includes(q))
        &&(cast==='All'||p.Cast===cast)&&(city==='All'||p.City===city))
      .sort((a,b)=>sort==='scoreDesc'?(b.match_score||0)-(a.match_score||0)
        :sort==='lastSeenDesc'?new Date(b.last_seen||0)-new Date(a.last_seen||0)
        :(a.rank||999)-(b.rank||999));
  },[profiles,search,cast,city,sort]);

  return (
    <div className="min-h-screen bg-slate-50">
      {phase==='startup' && <StartupDialog info={info} onExisting={handleExisting} onFresh={handleFresh}/>}
      {phase==='running' && <ProgressOverlay st={st}/>}

      <div className="p-4 md:p-8">
        {/* Header */}
        <header className="max-w-7xl mx-auto mb-8">
          <div className="flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
              <h1 className="text-4xl md:text-5xl font-black mb-2"
                style={{background:'linear-gradient(to right,#db2777,#fb7185)',WebkitBackgroundClip:'text',backgroundClip:'text',color:'transparent'}}>
                Potential Soulmates
              </h1>
              <p className="text-slate-400 text-sm">
                Matches for <strong className="text-slate-800">Sonali</strong>
                {info?.last_run && <span className="ml-2">· Last run: {info.last_run}</span>}
                {filters.agemin && filters.agemax && filters.months && (
                  <span className="block mt-1">
                    Filtered Matching people with age range : {filters.agemin} to {filters.agemax} who were last seen online within {filters.months} {filters.months === 1 ? 'month' : 'months'}
                  </span>
                )}
              </p>
            </div>
            <div className="flex items-center gap-3 flex-wrap">
              {[['Top Match',`${topPct}%`,'#22c55e'],['Avg Score',avg,'#fb7185'],['Shown',filtered.length,'#60a5fa']].map(([l,v,c])=>(
                <div key={l} className="bg-white px-5 py-3 rounded-2xl shadow-sm border border-slate-100">
                  <div className="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">{l}</div>
                  <div className="text-2xl font-black" style={{color:c}}>{v}</div>
                </div>
              ))}
              <button onClick={()=>setPhase('startup')}
                className="flex items-center gap-2 px-5 py-3 text-white rounded-2xl font-bold text-sm transition-colors"
                style={{background:'#db2777'}}>
                <Ic n="refresh" size={14}/> New Run
              </button>
            </div>
          </div>
          {error && <div className="mt-4 flex items-center gap-2 bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-red-700 text-sm">
            <Ic n="alert" size={14}/> {error}
          </div>}
        </header>

        {/* Controls */}
        <section className="max-w-7xl mx-auto mb-8 sticky top-4 z-40">
          <div className="bg-white/90 p-3 rounded-2xl shadow-lg border border-slate-100 flex flex-col lg:flex-row gap-3 items-center"
            style={{backdropFilter:'blur(8px)'}}>
            <div className="w-full lg:flex-1 relative">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Ic n="search" size={16}/></span>
              <input type="text" placeholder="Search ID or profession..."
                className="w-full bg-slate-50 rounded-xl pl-10 pr-4 py-3 text-sm outline-none focus:ring-2 focus:ring-pink-400"
                value={search} onChange={e=>setSearch(e.target.value)}/>
            </div>
            <div className="flex flex-wrap gap-2 w-full lg:w-auto">
              {[
                {ic:'filter',  val:cast, set:setCast, opts:casts},
                {ic:'mapPin',  val:city, set:setCity, opts:['All',...cities.filter(c=>c!=='All')]},
                {ic:'sort',    val:sort, set:setSort, opts:[['rankAsc','Best Match'],['scoreDesc','Highest Score'],['lastSeenDesc','Recently Active']]},
              ].map(({ic,val,set,opts},i)=>(
                <div key={i} className="flex-1 lg:flex-none flex items-center gap-2 bg-slate-50 border border-slate-100 rounded-xl px-3 focus-within:ring-2 focus-within:ring-pink-400">
                  <span className="text-slate-400 shrink-0"><Ic n={ic} size={13}/></span>
                  <select className="bg-transparent text-sm outline-none cursor-pointer py-2.5 w-full min-w-[100px]"
                    value={val} onChange={e=>set(e.target.value)}>
                    {opts.map(o=>Array.isArray(o)?<option key={o[0]} value={o[0]}>{o[1]}</option>:<option key={o} value={o}>{o}</option>)}
                  </select>
                </div>
              ))}
            </div>
          </div>
        </section>

        {/* Empty state */}
        {phase==='ready' && profiles.length===0 && (
          <div className="max-w-7xl mx-auto py-20 text-center">
            <div className="w-20 h-20 bg-pink-50 rounded-full flex items-center justify-center mx-auto mb-4 text-pink-400">
              <Ic n="play" size={32}/>
            </div>
            <h2 className="text-2xl font-bold mb-2">No results yet</h2>
            <p className="text-slate-400">Click <strong>New Run</strong> to start.</p>
          </div>
        )}

        {/* Grid */}
        {filtered.length > 0 && (
          <main className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            {filtered.map(p=>(
              <div key={p.id} onClick={()=>setSelected(p)}
                className="group bg-white rounded-3xl overflow-hidden border border-slate-100 cursor-pointer flex flex-col"
                style={{transition:'all .3s',boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}
                onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 20px 40px rgba(0,0,0,0.12)';e.currentTarget.style.transform='translateY(-6px)';}}
                onMouseLeave={e=>{e.currentTarget.style.boxShadow='0 1px 3px rgba(0,0,0,0.06)';e.currentTarget.style.transform='';}}>

                <div className="h-60 relative overflow-hidden shrink-0">
                  <img src={p.image_thumb || p.image_full} alt={p.id}
                    onError={e => {
                      if (!e.target.dataset.fallback) {
                        e.target.dataset.fallback = "1";
                        e.target.src = `https://ui-avatars.com/api/?name=${p.id}&size=400&background=db2777&color=fff&bold=true`;
                      }
                    }}
                    className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"/>
                  <div className="absolute inset-0" style={{background:'linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.1),transparent)'}}/>
                  <div className="absolute bottom-3 left-4 right-4 text-white">
                    <div className="flex gap-1.5 mb-1">
                      <span className="px-2 py-0.5 rounded-md text-[10px] font-bold" style={{background:'#db2777'}}>#{p.rank}</span>
                      <span className="bg-white/20 px-2 py-0.5 rounded-md text-[10px] font-bold truncate max-w-[110px]">
                        {(p.Cast||'N/A').split('-')[0].trim()}
                      </span>
                    </div>
                    <h3 className="font-bold text-lg">
                      {p.id}
                      {getAge(p.DOB) && (
                        <span className="ml-2 text-sm font-medium text-slate-300">
                          {getAge(p.DOB)} yrs
                        </span>
                      )}
                    </h3>
                  </div>
                  <div className="absolute top-3 right-3 bg-white px-2.5 py-1.5 rounded-xl flex flex-col items-center shadow">
                    <span className="text-[9px] font-bold text-slate-400 leading-none mb-0.5">MATCH</span>
                    <span className="text-base font-black leading-none" style={{color:'#f43f5e'}}>{p.compatibility_percent}%</span>
                  </div>
                </div>

                <div className="p-4 flex-1 flex flex-col">
                  <div className="space-y-2 mb-3 flex-1 text-slate-500 text-sm">
                    {[[<Ic n="briefcase" size={13}/>,p.Profession||'Not listed'],
                      [<Ic n="mapPin" size={13}/>,`${p.City||'?'}, GOA`],
                      [<Ic n="grad" size={13}/>,p.Education||'Not listed']].map(([ic,t],i)=>(
                      <div key={i} className="flex items-center gap-2">
                        <span className="text-slate-300 shrink-0">{ic}</span>
                        <span className="truncate">{t}</span>
                      </div>
                    ))}
                  </div>
                  <div className="flex items-center gap-1.5 text-xs text-slate-400 bg-slate-50 px-2.5 py-1.5 rounded-lg mb-3">
                    <Ic n="clock" size={11} cls="text-orange-400"/> Active: {daysAgo(p.last_seen)}
                  </div>
                  <div className="flex items-center justify-between border-t pt-3">
                    <div>
                      <div className="text-xs text-slate-400">Income</div>
                      <div className="font-bold text-sm truncate max-w-[120px]">{p["Monthly income"]||'N/A'}</div>
                    </div>
                    <div className="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-400
                      group-hover:text-white transition-all"
                      style={{}}
                      ref={el=>{if(el){el.style.background=el.closest('.group')&&el.closest('.group').matches(':hover')?'#db2777':'';}}}>
                      <Ic n="chevron" size={15}/>
                    </div>
                  </div>
                </div>
              </div>
            ))}
          </main>
        )}

        {profiles.length>0 && filtered.length===0 && (
          <div className="max-w-7xl mx-auto py-20 text-center">
            <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
              <Ic n="search" size={26}/>
            </div>
            <h2 className="text-xl font-bold mb-1">No matches found</h2>
            <p className="text-slate-400 text-sm">Try adjusting filters.</p>
          </div>
        )}

        <footer className="max-w-7xl mx-auto mt-16 pt-6 pb-8 border-t border-slate-100 text-center text-slate-400 text-xs">
          Ashtakoot Guna Matching · Soubhagya Laxmi Matrimony · Matchmaking for Sonali
        </footer>
      </div>

      <Modal profile={selected} onClose={()=>setSelected(null)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
