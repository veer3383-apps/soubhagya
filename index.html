// ── Helpers ──────────────────────────────────────────────────
const daysAgo = (s) => {
  if (!s) return 'N/A';
  const d = new Date(s), t = new Date();
  d.setHours(0,0,0,0); t.setHours(0,0,0,0);
  const days = Math.floor((t - d) / 86400000);
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  if (days < 30)  return `${days}d ago`;
  const months = Math.floor(days / 30), rem = days % 30;
  return rem === 0 ? `${months}mo ago` : `${months}mo ${rem}d ago`;
};

const getAge = (dob) => {
  if (!dob) return null;
  const d = new Date(dob);
  if (isNaN(d)) return null;
  const t = new Date();
  let age = t.getFullYear() - d.getFullYear();
  const m = t.getMonth() - d.getMonth();
  if (m < 0 || (m === 0 && t.getDate() < d.getDate())) age--;
  return age;
};

// ── Progress overlay ─────────────────────────────────────────
const ProgressOverlay = ({ st, steps, title }) => {
  const si  = steps.findIndex(s => s.key === st.step);
  const pct = st.total > 0 ? Math.round(st.progress/st.total*100) : 0;
  const hasBar = ['scanning','scraping','matching'].includes(st.step);
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/70"
      style={{backdropFilter:'blur(8px)'}}>
      <div className="bg-white rounded-3xl p-8 w-full max-w-lg mx-4 shadow-2xl">
        <div className="flex items-center gap-3 mb-8">
          <div className="w-10 h-10 rounded-xl bg-pink-100 flex items-center justify-center text-pink-600">
            <Ic n="loader" size={20} cls="spin"/>
          </div>
          <div>
            <h2 className="font-bold text-lg">{title || 'Pipeline Running'}</h2>
            <p className="text-slate-400 text-sm">Please wait — this takes a few minutes</p>
          </div>
        </div>
        <div className="space-y-2 mb-8">
          {steps.map((s, i) => {
            const done=i<si, cur=i===si, pend=i>si;
            return (
              <div key={s.key} className={`flex items-center gap-3 p-3 rounded-xl
                ${cur?'bg-pink-50 border border-pink-200':''}
                ${done?'opacity-40':''}${pend?' opacity-20':''}`}>
                <div className={`w-8 h-8 rounded-lg flex items-center justify-center shrink-0
                  ${done?'bg-green-100 text-green-600':cur?'bg-pink-100 text-pink-600':'bg-slate-100 text-slate-400'}`}>
                  {done?<Ic n="check" size={15}/>:cur?<Ic n="loader" size={15} cls="spin"/>:<Ic n={s.icon} size={15}/>}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-sm font-semibold">{s.label}</div>
                  {cur && <div className="text-xs text-pink-600 truncate">{st.message}</div>}
                </div>
                {cur && hasBar && st.total>0 &&
                  <span className="text-xs font-bold text-pink-600 shrink-0">{st.progress}/{st.total}</span>}
              </div>
            );
          })}
        </div>
        {hasBar && st.total>0 && (
          <div>
            <div className="flex justify-between text-xs text-slate-400 mb-1.5">
              <span className="truncate mr-2">{st.message}</span>
              <span className="font-bold text-pink-600 shrink-0">{pct}%</span>

                style={{width:`${pct}%`,background:'linear-gradient(to right,#ec4899,#fb7185)'}}/>
            </div>

};

// ── Profile card ─────────────────────────────────────────────
const ProfileCard = ({ p, onOpen, showActions=false, alreadyShortlisted=false, alreadyInterested=false }) => {
  const [actioned, setActioned] = useState({
    interest:  alreadyInterested,
    shortlist: alreadyShortlisted,
  });

  const doAction = async (e, type) => {
    e.stopPropagation();
    if (actioned[type]) return; // already done — no-op
    const url = type==='interest'
      ? `https://soubhagyalaxmi.com/ac-act/interest/${p.id}`
      : `https://soubhagyalaxmi.com/ac-act/shortlist/${p.id}`;
    try {
      await fetch(url, {method:'GET', mode:'no-cors'});
    } catch {}
    setActioned(prev => ({...prev, [type]:true}));
  };

  const hasLastSeen = p.last_seen && daysAgo(p.last_seen) !== 'N/A';

  return (
  <div onClick={()=>onOpen(p)}
    className="group bg-white rounded-3xl overflow-hidden border border-slate-100 cursor-pointer flex flex-col"
    style={{transition:'all .3s',boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}
    onMouseEnter={e=>{e.currentTarget.style.boxShadow='0 20px 40px rgba(0,0,0,0.12)';e.currentTarget.style.transform='translateY(-6px)';}}
    onMouseLeave={e=>{e.currentTarget.style.boxShadow='0 1px 3px rgba(0,0,0,0.06)';e.currentTarget.style.transform='';}}>
    <div className="h-60 relative overflow-hidden shrink-0">
      <img src={p.image_thumb||p.image_full} alt={p.id}
        onError={e=>{if(!e.target.dataset.fallback){e.target.dataset.fallback="1";e.target.src=`https://ui-avatars.com/api/?name=${p.id}&size=400&background=db2777&color=fff&bold=true`;}}}

      <div className="absolute inset-0" style={{background:'linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,.1),transparent)'}}/>
      <div className="absolute bottom-3 left-4 right-4 text-white">
        <div className="flex gap-1.5 mb-1">
          <span className="px-2 py-0.5 rounded-md text-[10px] font-bold" style={{background:'#db2777'}}>#{p.rank}</span>
          <span className="bg-white/20 px-2 py-0.5 rounded-md text-[10px] font-bold truncate max-w-[110px]">
            {(p.Cast||'N/A').split('-')[0].trim()}
          </span>
        </div>
        <h3 className="font-bold text-lg">
          {p.id}
          {getAge(p.DOB) && <span className="ml-2 text-sm font-medium text-slate-300">{getAge(p.DOB)} yrs</span>}
        </h3>
      </div>
      <div className="absolute top-3 right-3 bg-white px-2.5 py-1.5 rounded-xl flex flex-col items-center shadow">
        <span className="text-[9px] font-bold text-slate-400 leading-none mb-0.5">MATCH</span>
        <span className="text-base font-black leading-none" style={{color:'#f43f5e'}}>{p.compatibility_percent}%</span>
      </div>
    </div>
    <div className="p-4 flex-1 flex flex-col">
      <div className="space-y-2 mb-3 flex-1 text-slate-500 text-sm">
        {[[<Ic n="briefcase" size={13}/>,p.Profession||'Not listed'],
          [<Ic n="mapPin" size={13}/>,`${p.City||'?'}, GOA`],
          [<Ic n="grad" size={13}/>,p.Education||'Not listed']].map(([ic,t],i)=>(

            <span className="text-slate-300 shrink-0">{ic}</span>

      {hasLastSeen && (
        <div className="flex items-center gap-1.5 text-xs text-slate-400 bg-slate-50 px-2.5 py-1.5 rounded-lg mb-3">
          <Ic n="clock" size={11} cls="text-orange-400"/> Active: {daysAgo(p.last_seen)}
        </div>
      )}
      <div className="flex items-center justify-between border-t pt-3">
        <div>
          <div className="text-xs text-slate-400">Income</div>
          <div className="font-bold text-sm truncate max-w-[100px]">{p["Monthly income"]||'N/A'}</div>
        </div>
        <div className="flex items-center gap-2">
          {showActions && (
            <>
              {/* Shortlist button */}
              <button onClick={e=>doAction(e,'shortlist')} title={actioned.shortlist?'Already shortlisted':'Shortlist'}
                disabled={actioned.shortlist}
                className={`w-8 h-8 rounded-full flex items-center justify-center transition-all
                  ${actioned.shortlist
                    ?'bg-yellow-400 text-white cursor-default'
                    :'bg-slate-100 text-slate-400 hover:bg-yellow-400 hover:text-white'}`}>
                <Ic n="bookmark" size={14}/>
              </button>
              {/* Interest button */}
              <button onClick={e=>doAction(e,'interest')} title={actioned.interest?'Interest already expressed':'Express Interest'}
                disabled={actioned.interest}
                className={`w-8 h-8 rounded-full flex items-center justify-center transition-all
                  ${actioned.interest
                    ?'text-white cursor-default'
                    :'bg-slate-100 text-slate-400 hover:text-white'}`}
                style={{background: actioned.interest ? '#db2777' : ''}}
                onMouseEnter={e=>{if(!actioned.interest)e.currentTarget.style.background='#db2777';}}
                onMouseLeave={e=>{if(!actioned.interest)e.currentTarget.style.background='';}}>
                <Ic n="heart" size={14}/>
              </button>
            </>
          )}
          <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 group-hover:bg-pink-500 group-hover:text-white transition-all">
            <Ic n="chevron" size={15}/>
          </div>
        </div>
      </div>
    </div>
  </div>
  );
};

// ── Sidebar ───────────────────────────────────────────────────

    {/* Overlay */}
    {isOpen && (
      <div className="fixed inset-0 z-30 bg-black/40 sidebar-overlay"
        style={{backdropFilter:'blur(2px)'}} onClick={onClose}/>
    )}
    {/* Drawer */}

      {/* Header */}
      <div className="p-6 text-white" style={{background:'linear-gradient(135deg,#db2777,#f43f5e)'}}>
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2">
            <Ic n="heart" size={20} cls="shrink-0"/>
            <span className="font-black text-lg">Soubhagya</span>
          </div>
          <button onClick={onClose} className="w-8 h-8 flex items-center justify-center bg-white/20 hover:bg-white/30 rounded-lg transition-colors">
            <Ic n="x" size={16}/>

        </div>
        <p className="text-pink-100 text-xs">Matchmaking for Sonali</p>

      {/* Nav */}
      <nav className="flex-1 p-4 space-y-1">

        <button onClick={()=>{setView('matches');onClose();}}
          className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold transition-all
            ${view==='matches'?'text-white':'text-slate-600 hover:bg-slate-50'}`}
          style={view==='matches'?{background:'#db2777'}:{}}>
          <Ic n="list" size={17}/>
          <span>All Matches</span>
        </button>

        <button onClick={()=>{setView('shortlisted');onClose();}}
          className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold transition-all

          style={view==='shortlisted'?{background:'#db2777'}:{}}>
          <Ic n="bookmark" size={17}/>
          <span className="flex-1 text-left">Shortlisted</span>
          {slCount > 0 && (
            <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${view==='shortlisted'?'bg-white/20 text-white':'bg-pink-100 text-pink-600'}`}>
              {slCount}
            </span>
          )}
        </button>

        <button onClick={()=>{setView('interest_me');onClose();}}
          className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold transition-all
            ${view==='interest_me'?'text-white':'text-slate-600 hover:bg-slate-50'}`}
          style={view==='interest_me'?{background:'#db2777'}:{}}>
          <Ic n="heart" size={17}/>
          <span className="flex-1 text-left">Interested in Me</span>
          {imeCount > 0 && (
            <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${view==='interest_me'?'bg-white/20 text-white':'bg-pink-100 text-pink-600'}`}>
              {imeCount}
            </span>
          )}
        </button>

        <button onClick={()=>{setView('interest_to');onClose();}}
          className={`w-full flex items-center gap-3 px-3 py-3 rounded-xl text-sm font-semibold transition-all
            ${view==='interest_to'?'text-white':'text-slate-600 hover:bg-slate-50'}`}
          style={view==='interest_to'?{background:'#db2777'}:{}}>
          <Ic n="zap" size={17}/>
          <span className="flex-1 text-left">My Interests</span>
          {itoCount > 0 && (
            <span className={`text-xs font-bold px-2 py-0.5 rounded-full ${view==='interest_to'?'bg-white/20 text-white':'bg-pink-100 text-pink-600'}`}>
              {itoCount}
            </span>
          )}
        </button>
      </nav>

      {/* Single consolidated sync button */}
      <div className="p-4 border-t border-slate-100">
        {/* Show last sync times compactly */}
        <div className="space-y-0.5 mb-3">
          {[['Shortlisted', slStatus],['Interested in Me', imeStatus],['My Interests', itoStatus]].map(([label, st])=>(
            <div key={label} className="flex justify-between text-[10px] text-slate-400">
              <span>{label}</span>
              <span className="text-slate-300">{st?.last_run || 'Never'}</span>
            </div>
          ))}
        </div>
        {/* Running status message — shows whichever is currently active */}
        {(slStatus?.running || imeStatus?.running || itoStatus?.running) && (
          <p className="text-[10px] text-pink-600 mb-2 truncate">
            {slStatus?.running ? slStatus.message : imeStatus?.running ? imeStatus.message : itoStatus?.message}
          </p>
        )}
        <button onClick={onSyncAll}
          disabled={slStatus?.running || imeStatus?.running || itoStatus?.running}
          className={`w-full flex items-center justify-center gap-2 py-3 rounded-xl text-sm font-bold transition-colors
            ${(slStatus?.running||imeStatus?.running||itoStatus?.running)
              ?'bg-slate-100 text-slate-400'
              :'bg-slate-900 hover:bg-slate-700 text-white'}`}>
          {(slStatus?.running||imeStatus?.running||itoStatus?.running)
            ? <><Ic n="loader" size={14} cls="spin"/> Syncing...</>
            : <><Ic n="sync" size={14}/> Sync All Activity</>}

);

// ── Empty sync state ─────────────────────────────────────────
const EmptySync = ({ icon, title, desc, onOpen }) => (
  <div className="max-w-7xl mx-auto py-20 text-center">
    <div className="w-20 h-20 bg-pink-50 rounded-full flex items-center justify-center mx-auto mb-4 text-pink-400">
      <Ic n={icon} size={32}/>
    </div>
    <h2 className="text-2xl font-bold mb-2">{title}</h2>
    <p className="text-slate-400 mb-6">{desc}</p>
    <button onClick={onOpen}
      className="inline-flex items-center gap-2 px-6 py-3 text-white rounded-2xl font-bold" style={{background:'#db2777'}}>
      <Ic n="menu" size={16}/> Open Sidebar to Sync
    </button>
  </div>
);

// ── Main App ─────────────────────────────────────────────────
function App() {
  const [phase, setPhase]     = useState('init');
  const [info, setInfo]       = useState(null);
  const [filters, setFilters] = useState(() => {
    try { return JSON.parse(localStorage.getItem('filters')) || {agemin:null,agemax:null,months:null}; }
    catch { return {agemin:null,agemax:null,months:null}; }
  });

  // All matches
  const [profiles, setProfiles] = useState([]);
  const [st, setSt]             = useState({running:false,message:'',step:'',progress:0,total:0});

  // Shortlisted
  const [view, setView]             = useState('matches');
  const [slProfiles, setSlProfiles]   = useState([]);
  const [slSt, setSlSt]             = useState({running:false,message:'idle',step:'',progress:0,total:0,last_run:null,result_count:0});
  const [imeProfiles, setImeProfiles] = useState([]);
  const [imeSt, setImeSt]           = useState({running:false,message:'idle',step:'',progress:0,total:0,last_run:null,result_count:0});
  const [itoProfiles, setItoProfiles] = useState([]);
  const [itoSt, setItoSt]           = useState({running:false,message:'idle',step:'',progress:0,total:0,last_run:null,result_count:0});
  const [sidebarOpen, setSidebarOpen] = useState(false);

  // Shared
  const [selected, setSelected] = useState(null);
  const [search, setSearch]     = useState('');
  const [cast, setCast]         = useState('All');
  const [city, setCity]         = useState('All');
  const [sort, setSort]         = useState('rankAsc');
  const [error, setError]       = useState(null);
  const pollRef   = useRef(null);
  const slPollRef = useRef(null);

  // Init
  useEffect(()=>{
    fetch('/api/has_results').then(r=>r.json())
      .then(d=>{setInfo(d);setPhase('startup');})
      .catch(()=>setPhase('startup'));
    fetch('/api/shortlisted_status').then(r=>r.json()).then(setSlSt).catch(()=>{});
    fetch('/api/interest_me_status').then(r=>r.json()).then(setImeSt).catch(()=>{});
    fetch('/api/interest_to_status').then(r=>r.json()).then(setItoSt).catch(()=>{});
  },[]);

  useEffect(()=>{
    localStorage.setItem('filters', JSON.stringify(filters));
  },[filters]);

  const loadResults     = useCallback(()=>fetch('/api/results').then(r=>r.json()).then(d=>setProfiles(Array.isArray(d)?d:[])), []);
  const loadShortlisted = useCallback(()=>fetch('/api/shortlisted').then(r=>r.json()).then(d=>setSlProfiles(Array.isArray(d)?d:[])), []);
  const loadInterestMe  = useCallback(()=>fetch('/api/interest_me').then(r=>r.json()).then(d=>setImeProfiles(Array.isArray(d)?d:[])), []);
  const loadInterestTo  = useCallback(()=>fetch('/api/interest_to').then(r=>r.json()).then(d=>setItoProfiles(Array.isArray(d)?d:[])), []);
  const imePollRef = useRef(null);
  const itoPollRef = useRef(null);

  const pollStatus = useCallback(async()=>{
    const d = await fetch('/api/status').then(r=>r.json());
    setSt(d);
    if(!d.running && d.step==='done'){
      clearInterval(pollRef.current);
      await loadResults();
      setPhase('ready');
    }
    if(!d.running && d.step==='error'){
      clearInterval(pollRef.current);
      setError(d.message);
      setPhase('ready');
    }
  },[loadResults]);

  const pollSlStatus = useCallback(async()=>{
    const d = await fetch('/api/shortlisted_status').then(r=>r.json());
    setSlSt(d);
    if(!d.running && d.step==='done'){
      clearInterval(slPollRef.current);
      await loadShortlisted();
    }
    if(!d.running && d.step==='error'){
      clearInterval(slPollRef.current);
    }
  },[loadShortlisted]);

  const pollImeStatus = useCallback(async()=>{
    const d = await fetch('/api/interest_me_status').then(r=>r.json());
    setImeSt(d);
    if(!d.running && d.step==='done'){ clearInterval(imePollRef.current); await loadInterestMe(); }
    if(!d.running && d.step==='error'){ clearInterval(imePollRef.current); }
  },[loadInterestMe]);

  const pollItoStatus = useCallback(async()=>{
    const d = await fetch('/api/interest_to_status').then(r=>r.json());
    setItoSt(d);
    if(!d.running && d.step==='done'){ clearInterval(itoPollRef.current); await loadInterestTo(); }
    if(!d.running && d.step==='error'){ clearInterval(itoPollRef.current); }
  },[loadInterestTo]);

  const handleExisting = useCallback(async()=>{
    await Promise.all([loadResults(), loadShortlisted(), loadInterestMe(), loadInterestTo()]);
    try{ const s=localStorage.getItem('filters'); if(s) setFilters(JSON.parse(s)); }catch{}
    setPhase('ready');
  },[loadResults, loadShortlisted, loadInterestMe, loadInterestTo]);

  const handleFresh = useCallback(async(params)=>{
    setFilters(params); setPhase('running'); setError(null);
    await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)});
    clearInterval(pollRef.current);
    pollRef.current = setInterval(pollStatus,1500);
  },[pollStatus]);

  const handleSyncAll = useCallback(async()=>{
    // Fire all 3 pipelines sequentially (site may not handle concurrent sessions well)
    await fetch('/api/run_shortlisted',{method:'POST'});
    clearInterval(slPollRef.current);
    slPollRef.current = setInterval(pollSlStatus,1500);
    // Small delay between launches
    setTimeout(async()=>{
      await fetch('/api/run_interest_me',{method:'POST'});
      clearInterval(imePollRef.current);
      imePollRef.current = setInterval(pollImeStatus,1500);
    }, 500);
    setTimeout(async()=>{
      await fetch('/api/run_interest_to',{method:'POST'});
      clearInterval(itoPollRef.current);
      itoPollRef.current = setInterval(pollItoStatus,1500);
    }, 1000);
    setSidebarOpen(false);
  },[pollSlStatus, pollImeStatus, pollItoStatus]);

  useEffect(()=>()=>{
    clearInterval(pollRef.current); clearInterval(slPollRef.current);
    clearInterval(imePollRef.current); clearInterval(itoPollRef.current);
  },[]);

  // Active profiles based on view
  const activeProfiles = view==='matches' ? profiles
    : view==='shortlisted'  ? slProfiles
    : view==='interest_me'  ? imeProfiles
    : itoProfiles;

  // ID sets for cross-referencing icons on All Matches cards
  const shortlistedIds = useMemo(()=>new Set(slProfiles.map(p=>p.id)), [slProfiles]);
  const interestedIds  = useMemo(()=>new Set(itoProfiles.map(p=>p.id)), [itoProfiles]);

  const casts  = useMemo(()=>['All',...new Set(activeProfiles.map(p=>p.Cast).filter(Boolean))].sort(),[activeProfiles]);
  const cities = useMemo(()=>['All',...new Set(activeProfiles.map(p=>p.City).filter(Boolean))].sort(),[activeProfiles]);
  const topPct = useMemo(()=>activeProfiles.length?Math.max(...activeProfiles.map(p=>p.compatibility_percent||0)):0,[activeProfiles]);
  const avg    = useMemo(()=>activeProfiles.length?(activeProfiles.reduce((s,p)=>s+(p.match_score||0),0)/activeProfiles.length).toFixed(1):0,[activeProfiles]);

  const filtered = useMemo(()=>{
    const q=search.toLowerCase();
    return activeProfiles
      .filter(p=>(!q||(p.id||'').toLowerCase().includes(q)||(p.Profession||'').toLowerCase().includes(q))
        &&(cast==='All'||p.Cast===cast)&&(city==='All'||p.City===city))
      .sort((a,b)=>sort==='scoreDesc'?(b.match_score||0)-(a.match_score||0)
        :sort==='lastSeenDesc'?new Date(b.last_seen||0)-new Date(a.last_seen||0)
        :(a.rank||999)-(b.rank||999));
  },[activeProfiles,search,cast,city,sort]);

  const showProgress    = phase==='running';
  const showSlProgress  = slSt.running  && !showProgress;
  const showImeProgress = imeSt.running && !showProgress && !showSlProgress;
  const showItoProgress = itoSt.running && !showProgress && !showSlProgress && !showImeProgress;

  return (
    <div className="min-h-screen bg-slate-50">
      {phase==='startup' && <StartupDialog info={info} onExisting={handleExisting} onFresh={handleFresh}/>}
      {showProgress    && <ProgressOverlay st={st}    steps={STEPS}    title="Running Main Pipeline"/>}
      {showSlProgress  && <ProgressOverlay st={slSt}  steps={SL_STEPS} title="Syncing Shortlisted"/>}
      {showImeProgress && <ProgressOverlay st={imeSt} steps={SL_STEPS} title="Syncing — Interested in Me"/>}
      {showItoProgress && <ProgressOverlay st={itoSt} steps={SL_STEPS} title="Syncing — My Interests"/>}

      <Sidebar
        isOpen={sidebarOpen}
        onClose={()=>setSidebarOpen(false)}
        view={view}
        setView={(v)=>{setView(v); setSearch(''); setCast('All'); setCity('All');}}
        slCount={slProfiles.length}   imeCount={imeProfiles.length}  itoCount={itoProfiles.length}
        slStatus={slSt}               imeStatus={imeSt}              itoStatus={itoSt}
        onSyncAll={handleSyncAll}
      />

      <div className="p-4 md:p-8">
        {/* Header */}
        <header className="max-w-7xl mx-auto mb-8">
          <div className="flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div className="flex items-start gap-4">
              {/* Hamburger */}
              <button onClick={()=>setSidebarOpen(true)}
                className="mt-1 w-10 h-10 flex items-center justify-center bg-white border border-slate-200 rounded-xl shadow-sm hover:border-pink-300 transition-colors shrink-0">
                <Ic n="menu" size={18} cls="text-slate-600"/>
              </button>
              <div>
                <div className="flex items-center gap-3 mb-1">
                  <h1 className="text-4xl md:text-5xl font-black"
                    style={{background:'linear-gradient(to right,#db2777,#fb7185)',WebkitBackgroundClip:'text',backgroundClip:'text',color:'transparent'}}>
                    {view==='matches'     ? 'Potential Soulmates'
                    :view==='shortlisted' ? 'Shortlisted'
                    :view==='interest_me' ? 'Interested in Me'
                    :                      'My Interests'}
                  </h1>
                  {view!=='matches' && (
                    <span className="text-xs font-bold px-3 py-1 rounded-full text-white mt-2 shrink-0" style={{background:'#db2777'}}>
                      {view==='shortlisted'?'★ SHORTLISTED':view==='interest_me'?'💌 THEY LIKE ME':'💘 I LIKE THEM'}
                    </span>
                  )}
                </div>
                <p className="text-slate-400 text-sm">
                  Matches for <strong className="text-slate-800">Sonali</strong>
                  {view==='matches'     && info?.last_run    && <span className="ml-2">· Last run: {info.last_run}</span>}
                  {view==='shortlisted' && slSt?.last_run    && <span className="ml-2">· Synced: {slSt.last_run}</span>}
                  {view==='interest_me' && imeSt?.last_run   && <span className="ml-2">· Synced: {imeSt.last_run}</span>}
                  {view==='interest_to' && itoSt?.last_run   && <span className="ml-2">· Synced: {itoSt.last_run}</span>}
                  {view==='matches' && filters.agemin && filters.agemax && filters.months && (
                    <span className="block mt-1">
                      Age {filters.agemin}–{filters.agemax} · Active within {filters.months} {filters.months===1?'month':'months'}
                    </span>
                  )}
                </p>
              </div>
            </div>

            <div className="flex items-center gap-3 flex-wrap">
              {[['Top Match',`${topPct}%`,'#22c55e'],['Avg Score',avg,'#fb7185'],['Shown',filtered.length,'#60a5fa']].map(([l,v,c])=>(
                <div key={l} className="bg-white px-5 py-3 rounded-2xl shadow-sm border border-slate-100">
                  <div className="text-[10px] text-slate-400 font-bold uppercase tracking-wider mb-0.5">{l}</div>
                  <div className="text-2xl font-black" style={{color:c}}>{v}</div>
                </div>
              ))}
              <button onClick={()=>setPhase('startup')}
                className="flex items-center gap-2 px-5 py-3 text-white rounded-2xl font-bold text-sm transition-colors"
                style={{background:'#db2777'}}>
                <Ic n="refresh" size={14}/> New Run
              </button>
            </div>
          </div>
          {error && <div className="mt-4 flex items-center gap-2 bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-red-700 text-sm">
            <Ic n="alert" size={14}/> {error}
          </div>}
        </header>

        {/* Controls */}
        <section className="max-w-7xl mx-auto mb-8 sticky top-4 z-20">
          <div className="bg-white/90 p-3 rounded-2xl shadow-lg border border-slate-100 flex flex-col lg:flex-row gap-3 items-center"
            style={{backdropFilter:'blur(8px)'}}>
            <div className="w-full lg:flex-1 relative">
              <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Ic n="search" size={16}/></span>
              <input type="text" placeholder="Search ID or profession..."
                className="w-full bg-slate-50 rounded-xl pl-10 pr-4 py-3 text-sm outline-none focus:ring-2 focus:ring-pink-400"
                value={search} onChange={e=>setSearch(e.target.value)}/>
            </div>
            <div className="flex flex-wrap gap-2 w-full lg:w-auto">
              {[
                {ic:'filter', val:cast, set:setCast, opts:casts},
                {ic:'mapPin', val:city, set:setCity, opts:['All',...cities.filter(c=>c!=='All')]},
                {ic:'sort',   val:sort, set:setSort, opts:[['rankAsc','Best Match'],['scoreDesc','Highest Score'],['lastSeenDesc','Recently Active']]},
              ].map(({ic,val,set,opts},i)=>(
                <div key={i} className="flex-1 lg:flex-none flex items-center gap-2 bg-slate-50 border border-slate-100 rounded-xl px-3 focus-within:ring-2 focus-within:ring-pink-400">
                  <span className="text-slate-400 shrink-0"><Ic n={ic} size={13}/></span>
                  <select className="bg-transparent text-sm outline-none cursor-pointer py-2.5 w-full min-w-[100px]"
                    value={val} onChange={e=>set(e.target.value)}>
                    {opts.map(o=>Array.isArray(o)?<option key={o[0]} value={o[0]}>{o[1]}</option>:<option key={o} value={o}>{o}</option>)}
                  </select>
                </div>
              ))}
            </div>
          </div>
        </section>

        {/* Empty states */}
        {view==='shortlisted' && slProfiles.length===0 && !slSt.running && (
          <EmptySync icon="bookmark" title="No shortlisted data yet"
            desc="Sync profiles you've shortlisted on the site." onOpen={()=>setSidebarOpen(true)}/>
        )}
        {view==='interest_me' && imeProfiles.length===0 && !imeSt.running && (
          <EmptySync icon="heart" title="No data yet"
            desc="Sync profiles that have expressed interest in you." onOpen={()=>setSidebarOpen(true)}/>
        )}
        {view==='interest_to' && itoProfiles.length===0 && !itoSt.running && (
          <EmptySync icon="zap" title="No data yet"
            desc="Sync profiles you've expressed interest in." onOpen={()=>setSidebarOpen(true)}/>
        )}
        {view==='matches' && phase==='ready' && profiles.length===0 && (
          <div className="max-w-7xl mx-auto py-20 text-center">
            <div className="w-20 h-20 bg-pink-50 rounded-full flex items-center justify-center mx-auto mb-4 text-pink-400">
              <Ic n="play" size={32}/>
            </div>
            <h2 className="text-2xl font-bold mb-2">No results yet</h2>
            <p className="text-slate-400">Click <strong>New Run</strong> to start.</p>
          </div>
        )}

        {/* Grid */}
        {filtered.length > 0 && (
          <main className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            {filtered.map(p=><ProfileCard key={p.id} p={p} onOpen={setSelected}
              showActions={view==='matches'}
              alreadyShortlisted={shortlistedIds.has(p.id)}
              alreadyInterested={interestedIds.has(p.id)}
            />)}
          </main>
        )}

        {activeProfiles.length>0 && filtered.length===0 && (
          <div className="max-w-7xl mx-auto py-20 text-center">
            <div className="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-400">
              <Ic n="search" size={26}/>
            </div>
            <h2 className="text-xl font-bold mb-1">No matches found</h2>
            <p className="text-slate-400 text-sm">Try adjusting filters.</p>
          </div>
        )}

        <footer className="max-w-7xl mx-auto mt-16 pt-6 pb-8 border-t border-slate-100 text-center text-slate-400 text-xs">
          Ashtakoot Guna Matching · Soubhagya Laxmi Matrimony · Matchmaking for Sonali
        </footer>
      </div>

      <Modal profile={selected} onClose={()=>setSelected(null)}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
